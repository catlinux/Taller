<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#202427" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <script>
      // Aplica el modo de color guardado (taller_modo) antes de que cargue
      // React, para evitar el parpadeo al recargar. Por defecto, modo oscuro.
      try {
        var modoGuardado = localStorage.getItem('taller_modo') === 'claro' ? 'claro' : 'oscuro'
        document.documentElement.setAttribute('data-modo', modoGuardado)
      } catch (error) {
        document.documentElement.setAttribute('data-modo', 'oscuro')
      }
    </script>
    <title>Taller de bicicletas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
