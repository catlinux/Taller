# VirtualHost de Apache para un subdominio (p. ej. taller.midominio.com).
# Requiere: a2enmod proxy proxy_http headers rewrite ssl ; luego a2ensite taller
# Certificado: certbot --apache -d taller.midominio.com
<VirtualHost *:80>
    ServerName taller.midominio.com
    RewriteEngine On
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName taller.midominio.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/taller.midominio.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/taller.midominio.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog  ${APACHE_LOG_DIR}/taller-error.log
    CustomLog ${APACHE_LOG_DIR}/taller-access.log combined
</VirtualHost>
