services:
  taller:
    build: .
    container_name: taller
    restart: unless-stopped
    env_file: .env
    environment:
      # Lo pone el .env: «docker» si el vigilante del anfitrión atiende las órdenes de la app
      # (instalador de Linux/Mac) o vacío en Windows (allí se actualiza con actualizar.cmd).
      ACTUALIZACIONES: "${ACTUALIZACIONES:-}"
      CONTROL_DIR: /control
    ports: ["${BIND:-127.0.0.1}:${PUERTO:-3001}:3001"]
    volumes:
      - taller-data:/data
      - ./control:/control         # carpeta compartida con vigilante.sh
volumes:
  taller-data:
